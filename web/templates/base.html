<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BuffMarket{% endblock %} · уведомления</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if session.ok %}
<header><div class="bar">
  <span class="brand">BuffMarket → CSFloat</span>
  <nav>
    <a href="{{ url_for('index') }}" class="{{ 'on' if request.endpoint == 'index' }}">Обзор</a>
    <a href="{{ url_for('items') }}" class="{{ 'on' if request.endpoint == 'items' }}">Предметы</a>
    <a href="{{ url_for('settings_page') }}" class="{{ 'on' if request.endpoint in ('settings_page', 'settings_save') }}">Настройки</a>
  </nav>
  <form method="post" action="{{ url_for('logout') }}" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost small">Выйти</button>
  </form>
</div></header>
{% endif %}
<main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</main>
</body>
</html>
